name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run backend tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon test

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test/
            backend/build/test-results/test/
          if-no-files-found: warn

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:ci

      - name: Upload frontend test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-unit-test-reports
          path: frontend/test-results/
          if-no-files-found: warn

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs:
      - frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e:direct

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-e2e-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-test
      - frontend-e2e
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
