name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  microservice-test:
    name: Microservice Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            path: services/api-gateway
          - name: merchant-service
            path: services/merchant-service
          - name: user-service
            path: services/user-service
          - name: order-service
            path: services/order-service
          - name: settlement-service
            path: services/settlement-service
          - name: fulfillment-service
            path: services/fulfillment-service
          - name: engagement-service
            path: services/engagement-service
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run service tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon test

      - name: Upload service test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.name }}
          path: |
            ${{ matrix.path }}/build/reports/tests/test/
            ${{ matrix.path }}/build/test-results/test/
          if-no-files-found: warn

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:ci

      - name: Upload frontend test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-unit-test-reports
          path: frontend/test-results/
          if-no-files-found: warn

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs:
      - frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e:direct

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs:
      - microservice-test
      - frontend-test
      - frontend-e2e
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  container-build-and-k8s-deploy:
    name: Container Build and Kubernetes Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - microservice-test
      - frontend-test
      - frontend-e2e
      - frontend-build
    env:
      IMAGE_TAG: ${{ github.sha }}
      API_GATEWAY_IMAGE: aquared/life-service-assistant:api-gateway-${{ github.sha }}
      MERCHANT_SERVICE_IMAGE: aquared/life-service-assistant:merchant-service-${{ github.sha }}
      USER_SERVICE_IMAGE: aquared/life-service-assistant:user-service-${{ github.sha }}
      ORDER_SERVICE_IMAGE: aquared/life-service-assistant:order-service-${{ github.sha }}
      SETTLEMENT_SERVICE_IMAGE: aquared/life-service-assistant:settlement-service-${{ github.sha }}
      FULFILLMENT_SERVICE_IMAGE: aquared/life-service-assistant:fulfillment-service-${{ github.sha }}
      ENGAGEMENT_SERVICE_IMAGE: aquared/life-service-assistant:engagement-service-${{ github.sha }}
      FRONTEND_IMAGE: aquared/life-service-assistant:frontend-${{ github.sha }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build images
        run: |
          docker build -t "${API_GATEWAY_IMAGE}" -f services/api-gateway/Dockerfile .
          docker build -t "${MERCHANT_SERVICE_IMAGE}" -f services/merchant-service/Dockerfile .
          docker build -t "${USER_SERVICE_IMAGE}" -f services/user-service/Dockerfile .
          docker build -t "${ORDER_SERVICE_IMAGE}" -f services/order-service/Dockerfile .
          docker build -t "${SETTLEMENT_SERVICE_IMAGE}" -f services/settlement-service/Dockerfile .
          docker build -t "${FULFILLMENT_SERVICE_IMAGE}" -f services/fulfillment-service/Dockerfile .
          docker build -t "${ENGAGEMENT_SERVICE_IMAGE}" -f services/engagement-service/Dockerfile .
          docker build -t "${FRONTEND_IMAGE}" ./frontend

      - name: Push images
        run: |
          docker push "${API_GATEWAY_IMAGE}"
          docker push "${MERCHANT_SERVICE_IMAGE}"
          docker push "${USER_SERVICE_IMAGE}"
          docker push "${ORDER_SERVICE_IMAGE}"
          docker push "${SETTLEMENT_SERVICE_IMAGE}"
          docker push "${FULFILLMENT_SERVICE_IMAGE}"
          docker push "${ENGAGEMENT_SERVICE_IMAGE}"
          docker push "${FRONTEND_IMAGE}"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/ecs_key
          chmod 600 ~/.ssh/ecs_key
          ssh-keyscan -p "${{ secrets.ECS_SSH_PORT }}" "${{ secrets.ECS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload deployment files
        run: |
          tar -czf life-service-deploy.tgz k8s scripts db
          ssh -i ~/.ssh/ecs_key -p "${{ secrets.ECS_SSH_PORT }}" "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" 'mkdir -p ~/life-service'
          scp -i ~/.ssh/ecs_key -P "${{ secrets.ECS_SSH_PORT }}" life-service-deploy.tgz "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:~/life-service/life-service-deploy.tgz"

      - name: Deploy to ECS K3s
        run: |
          MYSQL_ROOT_PASSWORD_B64="$(printf '%s' "${MYSQL_ROOT_PASSWORD}" | base64 -w0)"
          JWT_SECRET_B64="$(printf '%s' "${JWT_SECRET}" | base64 -w0)"
          ssh -i ~/.ssh/ecs_key -p "${{ secrets.ECS_SSH_PORT }}" "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" \
            "IMAGE_TAG='${IMAGE_TAG}' \
            API_GATEWAY_IMAGE='${API_GATEWAY_IMAGE}' \
            MERCHANT_SERVICE_IMAGE='${MERCHANT_SERVICE_IMAGE}' \
            USER_SERVICE_IMAGE='${USER_SERVICE_IMAGE}' \
            ORDER_SERVICE_IMAGE='${ORDER_SERVICE_IMAGE}' \
            SETTLEMENT_SERVICE_IMAGE='${SETTLEMENT_SERVICE_IMAGE}' \
            FULFILLMENT_SERVICE_IMAGE='${FULFILLMENT_SERVICE_IMAGE}' \
            ENGAGEMENT_SERVICE_IMAGE='${ENGAGEMENT_SERVICE_IMAGE}' \
            FRONTEND_IMAGE='${FRONTEND_IMAGE}' \
            MYSQL_ROOT_PASSWORD_B64='${MYSQL_ROOT_PASSWORD_B64}' \
            JWT_SECRET_B64='${JWT_SECRET_B64}' \
            bash -s" <<'REMOTE_DEPLOY'
          set -euo pipefail
          cd ~/life-service
          tar -xzf life-service-deploy.tgz
          export MYSQL_ROOT_PASSWORD="$(printf '%s' "${MYSQL_ROOT_PASSWORD_B64}" | base64 -d)"
          export JWT_SECRET="$(printf '%s' "${JWT_SECRET_B64}" | base64 -d)"
          bash scripts/deploy-kind.sh
          REMOTE_DEPLOY

      - name: Health check
        run: |
          for i in {1..40}; do
            if curl -fsS "http://${{ secrets.ECS_HOST }}:30081/actuator/health" && curl -fsS "http://${{ secrets.ECS_HOST }}:30080/" > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed"
          exit 1

      - name: Collect Kubernetes diagnostics
        if: always()
        run: |
          mkdir -p k8s-diagnostics
          ssh -i ~/.ssh/ecs_key -p "${{ secrets.ECS_SSH_PORT }}" "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" 'bash -s' <<'REMOTE_DIAGNOSTICS'
          set +e
          cd ~/life-service
          rm -rf k8s-diagnostics
          mkdir -p k8s-diagnostics
          kubectl get all -o wide > k8s-diagnostics/resources.txt 2>&1
          kubectl describe pods > k8s-diagnostics/pods.txt 2>&1
          for deployment in life-assistant-api-gateway life-assistant-merchant-service life-assistant-user-service life-assistant-order-service life-assistant-settlement-service life-assistant-fulfillment-service life-assistant-engagement-service life-assistant-frontend life-assistant-mysql life-assistant-redis life-assistant-nacos; do
            kubectl logs deployment/${deployment} --tail=200 > k8s-diagnostics/${deployment}.log 2>&1
          done
          tar -czf k8s-diagnostics.tgz k8s-diagnostics
          REMOTE_DIAGNOSTICS
          scp -i ~/.ssh/ecs_key -P "${{ secrets.ECS_SSH_PORT }}" "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:~/life-service/k8s-diagnostics.tgz" k8s-diagnostics.tgz || true
          tar -xzf k8s-diagnostics.tgz || true

      - name: Upload Kubernetes diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k8s-diagnostics
          path: k8s-diagnostics/
          if-no-files-found: warn
