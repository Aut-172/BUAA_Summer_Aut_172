rootProject.name = 'life-assistant'

include 'api-gateway'
include 'merchant-service'
include 'user-service'
include 'order-service'
include 'settlement-service'
include 'fulfillment-service'
include 'engagement-service'

project(':api-gateway').projectDir = file('services/api-gateway')
project(':merchant-service').projectDir = file('services/merchant-service')
project(':user-service').projectDir = file('services/user-service')
project(':order-service').projectDir = file('services/order-service')
project(':settlement-service').projectDir = file('services/settlement-service')
project(':fulfillment-service').projectDir = file('services/fulfillment-service')
project(':engagement-service').projectDir = file('services/engagement-service')

includeBuild('services/common-lib') {
    dependencySubstitution {
        substitute(module('com.example:microservice-common')).using(project(':'))
    }
}
