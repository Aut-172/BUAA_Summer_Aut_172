server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: fulfillment-service
  config:
    import:
      - optional:nacos:life-assistant-common.yml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=${NACOS_CONFIG_REFRESH_ENABLED:true}
      - optional:nacos:${spring.application.name}.yml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=${NACOS_CONFIG_REFRESH_ENABLED:true}
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:127.0.0.1:8848}}
        namespace: ${NACOS_CONFIG_NAMESPACE:}
        group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
        file-extension: yml
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        fail-fast: ${NACOS_DISCOVERY_FAIL_FAST:false}
    loadbalancer:
      nacos:
        enabled: true
    sentinel:
      enabled: ${SENTINEL_ENABLED:true}
      eager: ${SENTINEL_EAGER:true}
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
      datasource:
        flow-rules:
          nacos:
            server-addr: ${NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:127.0.0.1:8848}}
            namespace: ${NACOS_CONFIG_NAMESPACE:}
            group-id: ${SENTINEL_RULE_GROUP:${NACOS_CONFIG_GROUP:DEFAULT_GROUP}}
            data-id: sentinel-${spring.application.name}-flow.json
            data-type: json
            rule-type: flow
        degrade-rules:
          nacos:
            server-addr: ${NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:127.0.0.1:8848}}
            namespace: ${NACOS_CONFIG_NAMESPACE:}
            group-id: ${SENTINEL_RULE_GROUP:${NACOS_CONFIG_GROUP:DEFAULT_GROUP}}
            data-id: sentinel-${spring.application.name}-degrade.json
            data-type: json
            rule-type: degrade
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:1000}
            read-timeout: ${FEIGN_READ_TIMEOUT:3000}
            logger-level: ${FEIGN_LOGGER_LEVEL:basic}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/fulfillment_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:123456}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
      schema-locations: ${SPRING_SQL_INIT_SCHEMA_LOCATIONS:classpath:db/fulfillment-schema.sql}
      continue-on-error: ${SPRING_SQL_INIT_CONTINUE_ON_ERROR:true}
  data:
    redis:
      host: ${APP_REDIS_HOST:localhost}
      port: ${APP_REDIS_PORT:6379}
      password: ${APP_REDIS_PASSWORD:}
      database: ${APP_REDIS_DATABASE:0}
      timeout: ${APP_REDIS_TIMEOUT:3000ms}
      connect-timeout: ${APP_REDIS_CONNECT_TIMEOUT:3000ms}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  type-aliases-package: com.example.demo.**.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

jwt:
  secret: ${JWT_SECRET:LifeAssistant2025SecretKeyForJWTTokenGenerationMustBe256BitsLong}
  expiration: ${JWT_EXPIRATION:86400000}

feign:
  sentinel:
    enabled: ${FEIGN_SENTINEL_ENABLED:true}

app:
  feign:
    logger-level: ${FEIGN_LOGGER_LEVEL:BASIC}
  auth:
    captcha-enabled: ${APP_AUTH_CAPTCHA_ENABLED:true}
  upload:
    root-dir: ${APP_UPLOAD_ROOT_DIR:uploads}
