server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: settlement-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        fail-fast: ${NACOS_DISCOVERY_FAIL_FAST:false}
    loadbalancer:
      nacos:
        enabled: true
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:3000}
            read-timeout: ${FEIGN_READ_TIMEOUT:5000}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/settlement_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

jwt:
  secret: ${JWT_SECRET:LifeAssistant2025SecretKeyForJWTTokenGenerationMustBe256BitsLong}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  upload:
    root-dir: ${APP_UPLOAD_ROOT_DIR:uploads}

mybatis-plus:
  type-aliases-package: com.example.demo.**.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
