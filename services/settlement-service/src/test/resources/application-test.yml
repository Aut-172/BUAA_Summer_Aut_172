spring:
  datasource:
    url: jdbc:h2:mem:settlement_service;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/settlement-test-schema.sql
  cloud:
    discovery:
      enabled: false
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 1000

mybatis-plus:
  type-aliases-package: com.example.demo.**.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
