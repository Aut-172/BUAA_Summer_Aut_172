server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        fail-fast: ${NACOS_DISCOVERY_FAIL_FAST:false}
    loadbalancer:
      nacos:
        enabled: true
    gateway:
      default-filters:
        - PreserveHostHeader
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: ${GATEWAY_CORS_ALLOWED_ORIGINS:*}
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: '*'
            exposed-headers:
              - Authorization
            allow-credentials: true
      routes:
        - id: user-auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth,/api/auth/login,/api/auth/register,/api/auth/admin/**,/api/captcha,/api/health

        - id: rider-auth
          uri: lb://fulfillment-service
          predicates:
            - Path=/api/auth/rider/**

        - id: engagement-review-public
          uri: lb://engagement-service
          predicates:
            - Path=/api/products/*/reviews,/api/merchants/*/reviews,/api/merchants/*/rating

        - id: merchant-catalog
          uri: lb://merchant-service
          predicates:
            - Path=/api/merchants/**,/api/products/**,/api/categories,/api/search,/api/recommend,/api/merchant/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**,/api/admin/**

        - id: fulfillment-service
          uri: lb://fulfillment-service
          predicates:
            - Path=/api/rider/**,/api/delivery/**

        - id: engagement-service
          uri: lb://engagement-service
          predicates:
            - Path=/api/reviews/**,/api/messages/**,/api/uploads/**,/uploads/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/checkout,/api/orders/**,/api/merchant/orders/**

        - id: settlement-service
          uri: lb://settlement-service
          predicates:
            - Path=/api/coupons/**,/api/payments/**,/api/orders/*/pay,/api/orders/*/payments

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
