server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  config:
    import:
      - optional:nacos:life-assistant-common.yml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=${NACOS_CONFIG_REFRESH_ENABLED:true}
      - optional:nacos:${spring.application.name}.yml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=${NACOS_CONFIG_REFRESH_ENABLED:true}
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:127.0.0.1:8848}}
        namespace: ${NACOS_CONFIG_NAMESPACE:}
        group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
        file-extension: yml
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        fail-fast: ${NACOS_DISCOVERY_FAIL_FAST:false}
    loadbalancer:
      nacos:
        enabled: true
    gateway:
      default-filters:
        - PreserveHostHeader
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: ${GATEWAY_CORS_ALLOWED_ORIGINS:*}
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: '*'
            exposed-headers:
              - Authorization
            allow-credentials: true
      routes:
        - id: user-auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth,/api/auth/login,/api/auth/register,/api/auth/admin/**,/api/captcha,/api/health

        - id: rider-auth
          uri: lb://fulfillment-service
          predicates:
            - Path=/api/auth/rider/**

        - id: merchant-auth
          uri: lb://merchant-service
          predicates:
            - Path=/api/auth/merchant/**

        - id: merchant-order-service
          uri: lb://order-service
          order: -20
          predicates:
            - Path=/api/merchant/orders,/api/merchant/orders/**

        - id: engagement-review-public
          uri: lb://engagement-service
          predicates:
            - Path=/api/products/*/reviews,/api/merchants/*/reviews,/api/merchants/*/rating

        - id: engagement-user-reviews
          uri: lb://engagement-service
          order: -30
          predicates:
            - Path=/api/user/reviews

        - id: merchant-catalog
          uri: lb://merchant-service
          predicates:
            - Path=/api/merchants/**,/api/products/**,/api/categories,/api/search,/api/recommend,/api/merchant/**,/api/admin/merchants,/api/admin/merchants/**

        - id: settlement-service
          uri: lb://settlement-service
          order: -20
          predicates:
            - Path=/api/coupons,/api/coupons/**,/api/payments/**,/api/orders/*/pay,/api/orders/*/payments

        - id: admin-order-service
          uri: lb://order-service
          order: -20
          predicates:
            - Path=/api/admin/orders,/api/admin/orders/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**,/api/admin/users,/api/admin/users/**

        - id: fulfillment-service
          uri: lb://fulfillment-service
          predicates:
            - Path=/api/rider/**,/api/delivery/**,/api/admin/riders,/api/admin/riders/**

        - id: engagement-service
          uri: lb://engagement-service
          predicates:
            - Path=/api/reviews/**,/api/messages/**,/api/uploads/**,/uploads/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/checkout,/api/orders,/api/orders/**,/api/merchant/orders,/api/merchant/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
