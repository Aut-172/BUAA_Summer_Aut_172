server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: engagement-service
  config:
    import:
      - optional:nacos:life-assistant-common.yml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=${NACOS_CONFIG_REFRESH_ENABLED:true}
      - optional:nacos:${spring.application.name}.yml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=${NACOS_CONFIG_REFRESH_ENABLED:true}
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:127.0.0.1:8848}}
        namespace: ${NACOS_CONFIG_NAMESPACE:}
        group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
        file-extension: yml
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        fail-fast: ${NACOS_DISCOVERY_FAIL_FAST:false}
    loadbalancer:
      nacos:
        enabled: true
    sentinel:
      enabled: ${SENTINEL_ENABLED:true}
      eager: ${SENTINEL_EAGER:true}
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
      datasource:
        flow-rules:
          nacos:
            server-addr: ${NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:127.0.0.1:8848}}
            namespace: ${NACOS_CONFIG_NAMESPACE:}
            group-id: ${SENTINEL_RULE_GROUP:${NACOS_CONFIG_GROUP:DEFAULT_GROUP}}
            data-id: sentinel-${spring.application.name}-flow.json
            data-type: json
            rule-type: flow
        degrade-rules:
          nacos:
            server-addr: ${NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:127.0.0.1:8848}}
            namespace: ${NACOS_CONFIG_NAMESPACE:}
            group-id: ${SENTINEL_RULE_GROUP:${NACOS_CONFIG_GROUP:DEFAULT_GROUP}}
            data-id: sentinel-${spring.application.name}-degrade.json
            data-type: json
            rule-type: degrade
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:1000}
            read-timeout: ${FEIGN_READ_TIMEOUT:3000}
            logger-level: ${FEIGN_LOGGER_LEVEL:basic}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/engagement_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:123456}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
      schema-locations: ${SPRING_SQL_INIT_SCHEMA_LOCATIONS:classpath:db/engagement-schema.sql}
      continue-on-error: ${SPRING_SQL_INIT_CONTINUE_ON_ERROR:true}
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:120MB}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  type-aliases-package: com.example.demo.**.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

jwt:
  secret: ${JWT_SECRET:LifeAssistant2025SecretKeyForJWTTokenGenerationMustBe256BitsLong}
  expiration: ${JWT_EXPIRATION:86400000}

feign:
  sentinel:
    enabled: ${FEIGN_SENTINEL_ENABLED:true}

app:
  feign:
    logger-level: ${FEIGN_LOGGER_LEVEL:BASIC}
  cache:
    enabled: ${APP_CACHE_ENABLED:true}
    default-ttl: ${APP_CACHE_DEFAULT_TTL:10m}
    ttl-jitter-ratio: ${APP_CACHE_TTL_JITTER_RATIO:0.1}
    ttl:
      engagement.review-list: ${APP_CACHE_ENGAGEMENT_REVIEW_LIST_TTL:5m}
      engagement.rating: ${APP_CACHE_ENGAGEMENT_RATING_TTL:10m}
      engagement.snapshot: ${APP_CACHE_ENGAGEMENT_SNAPSHOT_TTL:30m}
      image.metadata: ${APP_CACHE_IMAGE_METADATA_TTL:1h}
      image.blob: ${APP_CACHE_IMAGE_BLOB_TTL:10m}
    image:
      metadata-enabled: ${APP_CACHE_IMAGE_METADATA_ENABLED:true}
      blob-enabled: ${APP_CACHE_IMAGE_BLOB_ENABLED:true}
      max-blob-size-bytes: ${APP_CACHE_IMAGE_MAX_BLOB_SIZE_BYTES:524288}
  upload:
    root-dir: ${APP_UPLOAD_ROOT_DIR:uploads}
    review-dir: ${APP_UPLOAD_REVIEW_DIR:${APP_UPLOAD_ROOT_DIR:uploads}/reviews}
    max-image-size-bytes: ${APP_UPLOAD_MAX_IMAGE_SIZE_BYTES:20971520}
  oss:
    enabled: ${OSS_ENABLED:false}
    endpoint: ${OSS_ENDPOINT:oss-cn-heyuan.aliyuncs.com}
    bucket: ${OSS_BUCKET:buaa-summer-life-assistant}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    public-base-url: ${OSS_PUBLIC_BASE_URL:/oss}
    upload-prefix: ${OSS_UPLOAD_PREFIX:life-assistant}
    cname-enabled: ${OSS_CNAME_ENABLED:false}
