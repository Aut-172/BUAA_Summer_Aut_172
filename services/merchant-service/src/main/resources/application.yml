server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: merchant-service
  config:
    import:
      - optional:nacos:life-assistant-common.yml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=${NACOS_CONFIG_REFRESH_ENABLED:true}
      - optional:nacos:${spring.application.name}.yml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=${NACOS_CONFIG_REFRESH_ENABLED:true}
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:127.0.0.1:8848}}
        namespace: ${NACOS_CONFIG_NAMESPACE:}
        group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
        file-extension: yml
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        fail-fast: ${NACOS_DISCOVERY_FAIL_FAST:false}
    loadbalancer:
      nacos:
        enabled: true
    sentinel:
      enabled: ${SENTINEL_ENABLED:true}
      eager: ${SENTINEL_EAGER:true}
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
      datasource:
        flow-rules:
          nacos:
            server-addr: ${NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:127.0.0.1:8848}}
            namespace: ${NACOS_CONFIG_NAMESPACE:}
            group-id: ${SENTINEL_RULE_GROUP:${NACOS_CONFIG_GROUP:DEFAULT_GROUP}}
            data-id: sentinel-${spring.application.name}-flow.json
            data-type: json
            rule-type: flow
        degrade-rules:
          nacos:
            server-addr: ${NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:127.0.0.1:8848}}
            namespace: ${NACOS_CONFIG_NAMESPACE:}
            group-id: ${SENTINEL_RULE_GROUP:${NACOS_CONFIG_GROUP:DEFAULT_GROUP}}
            data-id: sentinel-${spring.application.name}-degrade.json
            data-type: json
            rule-type: degrade
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:1000}
            read-timeout: ${FEIGN_READ_TIMEOUT:3000}
            logger-level: ${FEIGN_LOGGER_LEVEL:basic}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/merchant_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${APP_REDIS_HOST:localhost}
      port: ${APP_REDIS_PORT:6379}
      password: ${APP_REDIS_PASSWORD:}
      database: ${APP_REDIS_DATABASE:0}
      timeout: ${APP_REDIS_TIMEOUT:3000ms}
      connect-timeout: ${APP_REDIS_CONNECT_TIMEOUT:3000ms}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

jwt:
  secret: ${JWT_SECRET:LifeAssistant2025SecretKeyForJWTTokenGenerationMustBe256BitsLong}
  expiration: ${JWT_EXPIRATION:86400000}

feign:
  sentinel:
    enabled: ${FEIGN_SENTINEL_ENABLED:true}

app:
  feign:
    logger-level: ${FEIGN_LOGGER_LEVEL:BASIC}
  cache:
    enabled: ${APP_CACHE_ENABLED:true}
    default-ttl: ${APP_CACHE_DEFAULT_TTL:10m}
    ttl-jitter-ratio: ${APP_CACHE_TTL_JITTER_RATIO:0.1}
    ttl:
      merchant.list: ${APP_CACHE_MERCHANT_LIST_TTL:5m}
      merchant.detail: ${APP_CACHE_MERCHANT_DETAIL_TTL:10m}
      merchant.product-detail: ${APP_CACHE_MERCHANT_PRODUCT_DETAIL_TTL:10m}
      merchant.categories: ${APP_CACHE_MERCHANT_CATEGORIES_TTL:1h}
      merchant.search: ${APP_CACHE_MERCHANT_SEARCH_TTL:5m}
      merchant.recommend: ${APP_CACHE_MERCHANT_RECOMMEND_TTL:5m}
  fault-tolerance:
    merchant-dashboard:
      fallback-message: ${MERCHANT_DASHBOARD_FALLBACK_MESSAGE:订单服务暂不可用，已返回临时看板数据，请稍后刷新。}
  upload:
    root-dir: ${APP_UPLOAD_ROOT_DIR:uploads}

mybatis-plus:
  type-aliases-package: com.example.demo.**.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
