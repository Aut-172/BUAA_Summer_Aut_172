apiVersion: apps/v1
kind: Deployment
metadata:
  name: life-assistant-nacos
  labels:
    app: life-assistant-nacos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: life-assistant-nacos
  template:
    metadata:
      labels:
        app: life-assistant-nacos
    spec:
      containers:
        - name: nacos
          image: nacos/nacos-server:v2.4.3
          ports:
            - containerPort: 8848
            - containerPort: 9848
          env:
            - name: MODE
              value: standalone
            - name: NACOS_AUTH_ENABLE
              value: "false"
            - name: JVM_XMS
              value: 256m
            - name: JVM_XMX
              value: 512m
            - name: JVM_XMN
              value: 128m
            - name: TZ
              value: Asia/Shanghai
          readinessProbe:
            tcpSocket:
              port: 8848
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: 8848
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nacos
spec:
  selector:
    app: life-assistant-nacos
  ports:
    - name: http
      port: 8848
      targetPort: 8848
    - name: grpc
      port: 9848
      targetPort: 9848
