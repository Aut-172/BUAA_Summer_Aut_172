apiVersion: apps/v1
kind: Deployment
metadata:
  name: life-assistant-frontend
  labels:
    app: life-assistant-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: life-assistant-frontend
  template:
    metadata:
      labels:
        app: life-assistant-frontend
    spec:
      containers:
        - name: frontend
          image: life-assistant-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: life-assistant-frontend
spec:
  selector:
    app: life-assistant-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
