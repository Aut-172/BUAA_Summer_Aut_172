apiVersion: apps/v1
kind: Deployment
metadata:
  name: life-assistant-redis
  labels:
    app: life-assistant-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: life-assistant-redis
  template:
    metadata:
      labels:
        app: life-assistant-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: life-assistant-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
