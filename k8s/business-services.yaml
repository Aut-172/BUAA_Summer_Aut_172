apiVersion: apps/v1
kind: Deployment
metadata:
  name: life-assistant-merchant-service
  labels:
    app: life-assistant-merchant-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: life-assistant-merchant-service
  template:
    metadata:
      labels:
        app: life-assistant-merchant-service
    spec:
      containers:
        - name: merchant-service
          image: life-assistant-merchant-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - { name: SERVER_PORT, value: "8081" }
            - name: APP_VERSION
              valueFrom: { configMapKeyRef: { name: life-assistant-config, key: app-version } }
            - name: NACOS_SERVER_ADDR
              valueFrom: { configMapKeyRef: { name: life-assistant-config, key: nacos-server-addr } }
            - { name: FEIGN_CONNECT_TIMEOUT, value: "1000" }
            - { name: FEIGN_READ_TIMEOUT, value: "3000" }
            - name: SPRING_DATASOURCE_URL
              valueFrom: { configMapKeyRef: { name: life-assistant-config, key: merchant-datasource-url } }
            - { name: SPRING_DATASOURCE_USERNAME, value: root }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: life-assistant-secret, key: mysql-root-password } }
            - name: REDIS_HOST
              valueFrom: { configMapKeyRef: { name: life-assistant-config, key: redis-host } }
            - name: REDIS_PORT
              valueFrom: { configMapKeyRef: { name: life-assistant-config, key: redis-port } }
            - name: REDIS_DATABASE
              valueFrom: { configMapKeyRef: { name: life-assistant-config, key: redis-database } }
            - name: APP_AUTH_CAPTCHA_ENABLED
              valueFrom: { configMapKeyRef: { name: life-assistant-config, key: app-auth-captcha-enabled } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: life-assistant-secret, key: jwt-secret } }
            - name: APP_UPLOAD_ROOT_DIR
              valueFrom: { configMapKeyRef: { name: life-assistant-config, key: app-upload-root-dir } }
            - { name: TZ, value: Asia/Shanghai }
          readinessProbe: { httpGet: { path: /api/health, port: 8081 }, initialDelaySeconds: 20, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 20 }
          livenessProbe: { httpGet: { path: /api/health, port: 8081 }, initialDelaySeconds: 60, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 5 }
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          volumeMounts:
            - { name: uploads, mountPath: /app/uploads }
      volumes:
        - { name: uploads, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-service
spec:
  selector:
    app: life-assistant-merchant-service
  ports:
    - { name: http, port: 8081, targetPort: 8081 }
