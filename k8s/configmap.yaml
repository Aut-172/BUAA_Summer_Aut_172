apiVersion: v1
kind: ConfigMap
metadata:
  name: life-assistant-config
data:
  mysql-database: life_assistant
  spring-datasource-url: jdbc:mysql://mysql:3306/life_assistant?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
  spring-sql-init-mode: "never"
  app-upload-root-dir: /app/uploads
  app-upload-review-dir: /app/uploads/reviews
  app-bootstrap-admin-enabled: "true"
