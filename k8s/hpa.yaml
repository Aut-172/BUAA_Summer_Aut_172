apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: life-assistant-merchant-service
  labels:
    app: life-assistant-merchant-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: life-assistant-merchant-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
