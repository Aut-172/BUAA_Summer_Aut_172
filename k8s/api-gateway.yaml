apiVersion: apps/v1
kind: Deployment
metadata:
  name: life-assistant-api-gateway
  labels:
    app: life-assistant-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: life-assistant-api-gateway
  template:
    metadata:
      labels:
        app: life-assistant-api-gateway
    spec:
      containers:
        - name: api-gateway
          image: life-assistant-api-gateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: life-assistant-config
                  key: app-version
            - name: NACOS_SERVER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: life-assistant-config
                  key: nacos-server-addr
            - name: NACOS_CONFIG_SERVER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: life-assistant-config
                  key: nacos-config-server-addr
            - name: NACOS_CONFIG_GROUP
              valueFrom:
                configMapKeyRef:
                  name: life-assistant-config
                  key: nacos-config-group
            - name: NACOS_CONFIG_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: life-assistant-config
                  key: nacos-config-namespace
            - name: NACOS_CONFIG_REFRESH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: life-assistant-config
                  key: nacos-config-refresh-enabled
            - name: TZ
              value: Asia/Shanghai
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: life-assistant-api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
  type: NodePort
